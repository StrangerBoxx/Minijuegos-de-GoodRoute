<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!--
  Portadas de las tarjetas de la biblioteca (una por juego), dibujadas en SVG.
  Para regenerarlas: abre este archivo en el navegador, haz una captura de cada
  <svg> (1280×800) y guárdala reducida a 960×600 en biblioteca/miniaturas/<id>.jpg.
  El id de cada <svg> es la carpeta del juego en biblioteca/juegos.js.
-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ccc; }
  svg { display: block; margin: 0 0 20px; font-family: Poppins, sans-serif; }
  .tag { font: 600 22px Poppins, sans-serif; letter-spacing: 3px; fill: #fff; }
  .titulo { font: italic 800 104px Poppins, sans-serif; fill: #fff; letter-spacing: -2px; }
  .sub { font: 500 28px Poppins, sans-serif; fill: #FAEAC8; }
  .marca { font: italic 800 26px Poppins, sans-serif; fill: #FAEAC8; opacity: .85; }
  .marca b { fill: #E8772E; }
  .num { font: 700 17px Poppins, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .pill { font: 700 24px Poppins, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .hora { font: 700 21px Poppins, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .ruta { font: italic 800 22px Poppins, sans-serif; fill: #0B2545; }
</style>
</head>
<body>

<!-- Elementos comunes: fondo con grilla de calles, brillo naranjo y sombra -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="grilla" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#173b68" stroke-width="2"/>
    </pattern>
    <radialGradient id="brillo" cx="0.74" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#E8772E" stop-opacity=".38"/>
      <stop offset="1" stop-color="#E8772E" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="sombraSuave" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <!-- Camioneta vista desde arriba, mirando a la derecha -->
    <g id="camioneta">
      <rect x="-50" y="-36" width="22" height="12" rx="3" fill="#1d1d1d"/>
      <rect x="26" y="-36" width="22" height="12" rx="3" fill="#1d1d1d"/>
      <rect x="-50" y="24" width="22" height="12" rx="3" fill="#1d1d1d"/>
      <rect x="26" y="24" width="22" height="12" rx="3" fill="#1d1d1d"/>
      <rect x="-64" y="-30" width="128" height="60" rx="14"/>
      <rect x="24" y="-22" width="22" height="44" rx="6" fill="#fff" opacity=".95"/>
      <rect x="-52" y="-18" width="64" height="36" rx="5" fill="#fff" opacity=".3"/>
    </g>
    <!-- Pin de ubicación con la punta en (0,0) -->
    <g id="pin">
      <path d="M0 0 C -8 -16 -26 -30 -26 -48 A 26 26 0 1 1 26 -48 C 26 -30 8 -16 0 0 Z"/>
      <circle cx="0" cy="-48" r="10" fill="#fff"/>
    </g>
  </defs>
</svg>

<!-- ============ 1) ¿Cuál es más corta? ============ -->
<svg id="ruta-corta" viewBox="0 0 1280 800" width="1280" height="800">
  <rect width="1280" height="800" fill="#0B2545"/>
  <rect width="1280" height="800" fill="url(#grilla)"/>
  <rect width="1280" height="800" fill="url(#brillo)"/>

  <g transform="translate(80 0)">
    <rect x="0" y="228" width="352" height="50" rx="25" fill="#E8772E"/>
    <text class="tag" x="176" y="261" text-anchor="middle">OJO DE OPTIMIZADOR</text>
    <text class="titulo" x="-4" y="410">¿Cuál es</text>
    <text class="titulo" x="-4" y="524">más corta?</text>
    <text class="sub" x="0" y="596">Elige la ruta con menos kilómetros.</text>
    <text class="marca" x="0" y="730">Good<tspan fill="#E8772E">Route</tspan></text>
  </g>

  <!-- Ruta B (más larga), detrás -->
  <g transform="translate(948 182) rotate(7)" filter="url(#sombra)">
    <rect width="300" height="400" rx="28" fill="#fff"/>
    <text class="ruta" x="26" y="44">Ruta B</text>
    <g transform="translate(20 62)">
      <rect width="260" height="260" rx="18" fill="#EAD9B5"/>
      <path d="M0 52H260M0 130H260M0 208H260M52 0V260M130 0V260M208 0V260" stroke="#FFFDF8" stroke-width="10"/>
      <polyline points="48,212 194,70 92,88 168,226 226,150 48,212" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
      <polyline points="48,212 194,70 92,88 168,226 226,150 48,212" fill="none" stroke="#0B2545" stroke-width="7" stroke-linejoin="round"/>
      <g fill="#fff" stroke="#0B2545" stroke-width="4">
        <circle cx="194" cy="70" r="15"/><circle cx="92" cy="88" r="15"/><circle cx="168" cy="226" r="15"/><circle cx="226" cy="150" r="15"/>
      </g>
      <g class="num" fill="#0B2545"><text x="194" y="71">1</text><text x="92" y="89">2</text><text x="168" y="227">3</text><text x="226" y="151">4</text></g>
      <rect x="32" y="196" width="32" height="32" rx="8" fill="#E8772E"/>
    </g>
    <rect x="70" y="340" width="160" height="44" rx="22" fill="#d64545"/>
    <text class="pill" x="150" y="362">15,1 km</text>
  </g>

  <!-- Ruta A (la más corta), delante -->
  <g transform="translate(686 150) rotate(-6)" filter="url(#sombra)">
    <rect width="300" height="400" rx="28" fill="#fff"/>
    <rect x="3" y="3" width="294" height="394" rx="26" fill="none" stroke="#1f9d6b" stroke-width="6"/>
    <text class="ruta" x="26" y="44">Ruta A</text>
    <g transform="translate(20 62)">
      <rect width="260" height="260" rx="18" fill="#EAD9B5"/>
      <path d="M0 52H260M0 130H260M0 208H260M52 0V260M130 0V260M208 0V260" stroke="#FFFDF8" stroke-width="10"/>
      <polyline points="48,212 92,88 194,70 226,150 168,226 48,212" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
      <polyline points="48,212 92,88 194,70 226,150 168,226 48,212" fill="none" stroke="#1f9d6b" stroke-width="7" stroke-linejoin="round"/>
      <g fill="#fff" stroke="#0B2545" stroke-width="4">
        <circle cx="92" cy="88" r="15"/><circle cx="194" cy="70" r="15"/><circle cx="226" cy="150" r="15"/><circle cx="168" cy="226" r="15"/>
      </g>
      <g class="num" fill="#0B2545"><text x="92" y="89">1</text><text x="194" y="71">2</text><text x="226" y="151">3</text><text x="168" y="227">4</text></g>
      <rect x="32" y="196" width="32" height="32" rx="8" fill="#E8772E"/>
    </g>
    <rect x="60" y="340" width="180" height="44" rx="22" fill="#1f9d6b"/>
    <text class="pill" x="150" y="362">✓ 12,4 km</text>
  </g>
</svg>

<!-- ============ 2) Ruta a Mano (carpeta ganale-al-chip-pulso) ============ -->
<svg id="ganale-al-chip-pulso" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <clipPath id="panelRuta"><rect x="610" y="90" width="610" height="620" rx="36"/></clipPath>
  </defs>
  <rect width="1280" height="800" fill="#0B2545"/>
  <rect width="1280" height="800" fill="url(#grilla)"/>
  <rect width="1280" height="800" fill="url(#brillo)"/>

  <g transform="translate(80 0)">
    <rect x="0" y="228" width="190" height="50" rx="25" fill="#E8772E"/>
    <text class="tag" x="95" y="261" text-anchor="middle">A PULSO</text>
    <text class="titulo" x="-4" y="410">Ruta</text>
    <text class="titulo" x="-4" y="524">a Mano</text>
    <text class="sub" x="0" y="596">Maneja tú y llega</text>
    <text class="sub" x="0" y="636">antes que el optimizador.</text>
    <text class="marca" x="0" y="730">Good<tspan fill="#E8772E">Route</tspan></text>
  </g>

  <!-- Ciudad -->
  <g filter="url(#sombra)">
    <rect x="610" y="90" width="610" height="620" rx="36" fill="#EAD9B5"/>
  </g>
  <g clip-path="url(#panelRuta)">
    <g fill="#FFFDF8">
      <rect x="610" y="236" width="610" height="48"/>
      <rect x="610" y="400" width="610" height="48"/>
      <rect x="610" y="564" width="610" height="48"/>
      <rect x="742" y="90" width="48" height="620"/>
      <rect x="906" y="90" width="48" height="620"/>
      <rect x="1070" y="90" width="48" height="620"/>
    </g>
    <!-- obra -->
    <g transform="translate(930 340)"><rect x="-8" y="-26" width="16" height="52" rx="4" fill="#E8772E"/><rect x="-8" y="-6" width="16" height="6" fill="#fff"/><rect x="-8" y="10" width="16" height="6" fill="#fff"/></g>
    <!-- ruta óptima del optimizador (naranja) -->
    <path d="M1094 424 V588 H930" fill="none" stroke="#E8772E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <!-- rastro del jugador -->
    <path d="M622 260 H672" fill="none" stroke="#2f6fd6" stroke-width="10" stroke-dasharray="18 14" stroke-linecap="round"/>
    <!-- líneas de velocidad -->
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9">
      <path d="M700 246 H748"/><path d="M684 262 H744"/><path d="M700 278 H748"/>
    </g>
  </g>
  <!-- clientes -->
  <g fill="#0B2545" filter="url(#sombraSuave)">
    <use href="#pin" transform="translate(930 610) scale(.95)"/>
    <use href="#pin" transform="translate(1094 262) scale(.95)"/>
    <use href="#pin" transform="translate(766 590) scale(.95)"/>
  </g>
  <!-- camioneta del jugador -->
  <g transform="translate(842 260)" fill="#E8772E" filter="url(#sombraSuave)"><use href="#camioneta"/></g>
  <!-- el optimizador -->
  <g transform="translate(1094 424)" filter="url(#sombraSuave)">
    <rect x="-104" y="-30" width="208" height="60" rx="30" fill="#0B2545" stroke="#E8772E" stroke-width="5"/>
    <text x="0" y="2" class="pill" style="font-size:22px">OPTIMIZADOR</text>
  </g>
</svg>

<!-- ============ 3) Jornada Perfecta ============ -->
<svg id="jornada-perfecta" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <clipPath id="panelJornada"><rect x="610" y="150" width="610" height="560" rx="36"/></clipPath>
  </defs>
  <rect width="1280" height="800" fill="#0B2545"/>
  <rect width="1280" height="800" fill="url(#grilla)"/>
  <rect width="1280" height="800" fill="url(#brillo)"/>

  <g transform="translate(80 0)">
    <rect x="0" y="228" width="330" height="50" rx="25" fill="#E8772E"/>
    <text class="tag" x="165" y="261" text-anchor="middle">VENTANAS HORARIAS</text>
    <text class="titulo" x="-4" y="410">Jornada</text>
    <text class="titulo" x="-4" y="524">Perfecta</text>
    <text class="sub" x="0" y="596">Llega a la hora a cada cliente.</text>
    <text class="marca" x="0" y="730">Good<tspan fill="#E8772E">Route</tspan></text>
  </g>

  <!-- Mapa con la ruta del día -->
  <g filter="url(#sombra)"><rect x="610" y="150" width="610" height="560" rx="36" fill="#EAD9B5"/></g>
  <g clip-path="url(#panelJornada)">
    <g fill="#FFFDF8">
      <rect x="610" y="280" width="610" height="44"/>
      <rect x="610" y="440" width="610" height="44"/>
      <rect x="610" y="600" width="610" height="44"/>
      <rect x="740" y="150" width="44" height="560"/>
      <rect x="900" y="150" width="44" height="560"/>
      <rect x="1060" y="150" width="44" height="560"/>
    </g>
    <path d="M660 622 H762 V462 H922 V302 H1082 V462" fill="none" stroke="#fff" stroke-width="20" stroke-linejoin="round"/>
    <path d="M660 622 H762 V462 H922 V302 H1082 V462" fill="none" stroke="#0B2545" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- base -->
  <rect x="636" y="598" width="48" height="48" rx="11" fill="#E8772E" filter="url(#sombraSuave)"/>
  <path d="M647 622 L660 609 L673 622 Z M651 621 h18 v12 h-18 Z" fill="#fff"/>
  <!-- clientes con su hora -->
  <g filter="url(#sombraSuave)">
    <circle cx="762" cy="462" r="20" fill="#1f9d6b" stroke="#fff" stroke-width="5"/>
    <circle cx="922" cy="302" r="20" fill="#1f9d6b" stroke="#fff" stroke-width="5"/>
    <circle cx="1082" cy="462" r="20" fill="#fff" stroke="#0B2545" stroke-width="5"/>
  </g>
  <g fill="#fff" class="num" style="font-size:20px"><text x="762" y="463">✓</text><text x="922" y="303">✓</text></g>
  <g>
    <rect x="712" y="398" width="100" height="38" rx="19" fill="#0B2545"/><text class="hora" x="762" y="417">09:30</text>
    <rect x="872" y="238" width="100" height="38" rx="19" fill="#0B2545"/><text class="hora" x="922" y="257">11:00</text>
    <rect x="1032" y="502" width="100" height="38" rx="19" fill="#E8772E"/><text class="hora" x="1082" y="521">14:30</text>
  </g>
  <!-- camioneta en camino -->
  <g transform="translate(1082 380) rotate(90)" fill="#2f6fd6" filter="url(#sombraSuave)"><use href="#camioneta" transform="scale(.8)"/></g>
  <!-- reloj -->
  <g transform="translate(1130 160)" filter="url(#sombra)">
    <circle r="104" fill="#FAEAC8" stroke="#E8772E" stroke-width="14"/>
    <g stroke="#0B2545" stroke-width="7" stroke-linecap="round">
      <path d="M0 -78V-64M0 78V64M-78 0H-64M78 0H64"/>
    </g>
    <path d="M0 0 L0 -54" stroke="#0B2545" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 0 L40 22" stroke="#E8772E" stroke-width="9" stroke-linecap="round"/>
    <circle r="11" fill="#0B2545"/>
  </g>
</svg>

</body>
</html>
