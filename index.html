<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Minijuegos GoodRoute</title>
  <link rel="icon" type="image/png" href="biblioteca/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="biblioteca/biblioteca.css" />
</head>
<body>
  <!-- Biblioteca -->
  <main class="biblioteca" id="biblioteca">
    <header class="cabecera">
      <img class="logo" id="logo" src="biblioteca/logo-goodroute.gif" alt="GoodRoute" />
      <div class="cabecera-texto">
        <p class="eyebrow">Stand de Control Position</p>
        <h1>Minijuegos <span class="acento">de ruta</span></h1>
        <p class="lead">Cada juego muestra una parte del producto en un minuto. Elige uno para empezar.</p>
      </div>
    </header>

    <div class="barra-filtros">
      <nav class="filtros" id="filtros" aria-label="Filtrar por modo de juego"></nav>
      <button class="btn-azar" id="btn-azar" type="button"><img class="dado" src="biblioteca/favicon.png" alt="" aria-hidden="true" /> <span id="btn-azar-texto">Juego al azar</span></button>
    </div>
    <!-- Sub-filtro por cómo se juega (mouse o táctil); solo aparece si la pestaña tiene de los dos -->
    <div class="barra-subfiltros" id="barra-subfiltros" hidden>
      <nav class="subfiltros" id="subfiltros" aria-label="Filtrar por cómo se juega"></nav>
      <p class="subfiltro-detalle" id="subfiltro-detalle"></p>
    </div>

    <section class="grilla" id="grilla" aria-live="polite"></section>

    <footer class="pie">
      <span id="conteo"></span>
      <span class="pie-botones">
        <button class="btn-pantalla-lib" id="btn-reiniciar" type="button">↺ Reiniciar récords</button>
        <button class="btn-pantalla-lib" id="btn-pantalla-lib" type="button">⛶ Pantalla completa</button>
      </span>
    </footer>
  </main>

  <!-- Juego abierto -->
  <section class="sala" id="sala" hidden>
    <header class="barra">
      <a class="volver" href="#" id="volver">← Biblioteca</a>
      <span class="barra-titulo" id="barra-titulo"></span>
      <button class="barra-pantalla" id="barra-pantalla" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    </header>
    <iframe id="marco" title="Minijuego" allow="fullscreen"></iframe>
  </section>

  <script src="biblioteca/juegos.js"></script>
  <script src="biblioteca/biblioteca.js"></script>
</body>
</html>
