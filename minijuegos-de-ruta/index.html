<!--
  Minijuegos de ruta · GoodRoute
  Cinco desafíos de menos de un minuto, pensados para celular.
  Todo está en este archivo: estilos, lógica y dibujo (canvas). Los récords se
  guardan en localStorage, solo en el dispositivo.
-->
<style>
:root {
  color-scheme: only light;
  --azul: #0B2545; --naranjo: #E8772E; --crema: #FAEAC8; --fondo: #F7F4F1;
  --verde: #1f9d6b; --rojo: #d64545; --texto: #1d2433; --suave: #6b7280; --borde: #ece6df;
  /* nombres que usa online.css (sala con los QR) */
  --bg: var(--fondo); --surface: #fff; --border: var(--borde); --muted: var(--suave); --accent: var(--azul);
  --accent-soft: #e3e9f2; --ok: var(--verde); --text: var(--texto); --mono: ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: Poppins, system-ui, sans-serif; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body.jugando { overflow: hidden; }
[hidden] { display: none !important; }
h1, h2 { font-style: italic; font-weight: 800; margin: 0; line-height: 1.1; color: var(--azul); }
button { font: inherit; cursor: pointer; border: 0; }

/* ---------- Inicio ---------- */
.inicio {
  max-width: 980px; margin: 0 auto;
  padding: calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
.cab { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin-bottom: 14px; }
.cab img { height: 52px; width: auto; }
.cab h1 { font-size: clamp(30px, 8vw, 44px); margin-top: 8px; }
.cab p { margin: 0; color: var(--suave); font-size: 15px; max-width: 440px; line-height: 1.45; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 12px 26px; border-radius: 999px;
  font-weight: 600; font-size: 16px; background: var(--azul); color: #fff;
  transition: transform .1s, box-shadow .2s;
}
.btn:active { transform: scale(.97); }
.btn:focus-visible, .tarjeta:focus-visible, .volver:focus-visible { outline: 3px solid var(--naranjo); outline-offset: 3px; }
.btn-naranjo { background: var(--naranjo); box-shadow: 0 6px 18px rgba(232, 119, 46, .32); }
.btn-claro { background: #fff; color: var(--azul); border: 2px solid var(--borde); }
.azar { display: flex; justify-content: center; margin: 14px 0 20px; }
.tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.tarjeta {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; color: inherit;
  background: #fff; border-radius: 22px; padding: 16px; border: 2px solid transparent;
  box-shadow: 0 2px 12px rgba(11, 37, 69, .07); transition: transform .12s, border-color .15s, box-shadow .15s;
}
.tarjeta:active { transform: scale(.98); }
.tarjeta.sorteo { border-color: var(--naranjo); box-shadow: 0 0 0 5px rgba(232, 119, 46, .22); }
.icono { flex: none; width: 58px; height: 58px; border-radius: 18px; background: var(--crema); display: grid; place-items: center; }
.icono svg { width: 38px; height: 38px; }
.t-cuerpo { flex: 1; min-width: 0; }
.etq { display: inline-block; font-size: 12px; font-weight: 600; color: #b9551a; background: #fdeee3; padding: 2px 10px; border-radius: 999px; }
.tarjeta h2 { font-size: 20px; margin: 6px 0 4px; }
.tarjeta p { margin: 0 0 10px; font-size: 14px; color: var(--suave); line-height: 1.4; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--suave); }
.meta b { color: var(--azul); }
.nota { margin: 20px 0 0; text-align: center; font-size: 13px; color: var(--suave); }

/* ---------- Juego ---------- */
.juego { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--fondo); }
.barra {
  flex: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
  background: var(--azul); color: #fff;
}
.barra .volver[hidden] + .barra-titulo { padding-left: 4px; }
.volver { width: 44px; height: 44px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; font-size: 22px; display: grid; place-items: center; }
.barra-titulo { font-weight: 700; font-style: italic; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marcador { font-weight: 600; font-size: 15px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.marcador .sep { opacity: .45; margin: 0 5px; }
.marcador .x2 { background: var(--naranjo); border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-size: 13px; }
.area { position: relative; flex: 1; min-height: 0; margin-bottom: env(safe-area-inset-bottom); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.capa { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(247, 244, 241, .84); backdrop-filter: blur(2px); overflow: auto; }
.panel { width: 100%; max-width: 420px; margin: auto; background: #fff; border-radius: 26px; padding: 22px 20px; box-shadow: 0 12px 40px rgba(11, 37, 69, .16); text-align: center; }
.panel .etq { margin-bottom: 6px; }
.panel h2 { font-size: 26px; }
.pasos { list-style: none; padding: 0; margin: 16px 0 20px; text-align: left; display: grid; gap: 12px; }
.pasos li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.45; }
.pasos li span { flex: none; width: 30px; height: 30px; border-radius: 999px; background: var(--naranjo); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 15px; }
.panel .btn { width: 100%; }
.puntaje { font-size: 68px; font-weight: 800; font-style: italic; color: var(--azul); line-height: 1; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
.puntaje-txt { margin: 0; color: var(--suave); font-size: 14px; }
.record-nuevo { display: inline-block; background: var(--verde); color: #fff; font-weight: 700; padding: 5px 16px; border-radius: 999px; font-size: 15px; margin: 10px 0 2px; animation: salta .6s ease-out; }
.record-ant { margin: 6px 0 0; font-size: 13px; color: var(--suave); }
@keyframes salta { 0% { transform: scale(.5); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.stat { background: var(--fondo); border-radius: 16px; padding: 10px 4px; }
.stat b { display: block; font-size: 20px; color: var(--azul); font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; color: var(--suave); line-height: 1.2; display: block; }
.dato { margin: 18px 0 16px; }
.dato-tit { margin: 0 0 12px; font-size: 21px; font-weight: 700; line-height: 1.25; color: var(--azul); text-wrap: balance; }
.dato-tit:empty { display: none; }
.pide-nombre { margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; background: var(--crema); color: var(--azul); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.pide-nombre[hidden] { display: none; }
.pide-nombre i { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 800; font-size: 14px; }
.nombre-cel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 12px 0 4px; }
.nombre-cel .guardar-nombre { min-width: 0; margin: 0; }
.nombre-cel .guardar-nombre input { flex: 1 1 0; width: 0; }
.nombre-cel .guardar-nombre .btn { flex: none; }
.nombre-cel label { font-size: 15px; font-weight: 600; color: var(--azul); }
.nombre-ok { margin: 10px 0 0; font-size: 16px; font-weight: 600; color: var(--verde); }
.dato-txt { margin: 0; padding: 12px 14px; border-radius: 14px; background: #e3ebf5; color: #033E84; font-size: 14px; line-height: 1.5; text-wrap: pretty; }
.gr-marca { font-weight: 700; font-style: italic; letter-spacing: -0.01em; }
.botones { display: grid; gap: 10px; }
.guardar-nombre { display: flex; gap: 8px; margin: 0 0 4px; }
.guardar-nombre input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 999px;
  border: 2px solid var(--borde); background: var(--fondo); color: var(--texto); user-select: text; -webkit-user-select: text;
}
.guardar-nombre .btn { width: auto; padding: 10px 20px; min-height: 46px; }
#fin-ranking { margin: 14px 0 16px; }
/* ---------- Ranking: la misma tabla en todos los juegos ---------- */
.ranking { margin-top: 18px; text-align: left; font-family: Poppins, system-ui, sans-serif; }
.ranking:empty { display: none; }
.ranking h3 { margin: 0 0 8px; text-align: center; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; font-style: normal; }
.ranking ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ranking li {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px;
  padding: 7px 12px; border-radius: 12px; background: #F7F4F1; font-size: 15px; color: #1d2433;
}
.ranking li .pos {
  width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center;
  font-weight: 700; font-size: 12px; background: #ece6df; color: #0B2545; font-family: inherit;
}
.ranking li:nth-child(1) .pos { background: #E8772E; color: #fff; }
.ranking li:nth-child(2) .pos { background: #0B2545; color: #fff; }
.ranking li:nth-child(3) .pos { background: #b08a5a; color: #fff; }
.ranking li .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking li .pts { margin: 0; font-weight: 700; color: #0B2545; font-variant-numeric: tabular-nums; font-family: inherit; }
.ranking li.tuyo { background: #FAEAC8; font-weight: 600; box-shadow: inset 0 0 0 2px #E8772E; }


/* ---------- Jugadores y celulares ---------- */
.cuantos { margin: 0 0 8px; font-weight: 600; color: var(--azul); }
.num-jug { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.num-jug button {
  width: 46px; height: 46px; border-radius: 14px; font-weight: 700; font-size: 18px;
  background: var(--fondo); color: var(--azul); border: 2px solid var(--borde);
}
.num-jug button[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }
.modos-ruta { display: grid; gap: 10px; }
.btn-azul { background: var(--azul); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.modo-nota { margin: 4px 0 0; font-size: 13px; color: var(--suave); }
.modo-nota:empty { display: none; }
.panel.tarjeta-sala { max-width: 560px; }
.sala-pie .btn { width: auto; }
/* Marcador en vivo y podio (pantalla grande) */
.panel-vivo { max-width: 620px; }
.vivo-lista { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; text-align: left; }
.vivo-lista li { display: grid; grid-template-columns: 34px 40px 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: var(--fondo); transition: transform .2s; }
.vivo-lista li.primero { background: var(--crema); }
.vivo-lista .pos { font-weight: 800; font-style: italic; font-size: 20px; color: var(--suave); text-align: center; }
.vivo-lista .num { width: 40px; height: 40px; border-radius: 12px; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.vivo-lista .quien { font-weight: 700; font-size: 17px; color: var(--azul); line-height: 1.2; }
.vivo-lista .quien small { display: block; font-weight: 500; font-size: 13px; color: var(--suave); }
.vivo-lista .pts { font-weight: 800; font-style: italic; font-size: 26px; color: var(--azul); font-variant-numeric: tabular-nums; }
.vivo-lista .listo { color: var(--verde); }
.vivo-lista .fuera { color: var(--rojo); }
/* Celular: color del jugador en la barra */
.yo { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 10px; color: #fff; font-weight: 800; margin-right: 8px; font-style: normal; }
.btn-terminar-vivo { position: absolute; right: 14px; bottom: 82px; min-height: 40px; padding: 8px 18px; font-size: 14px; }
.listos { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
.listos span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--fondo); color: var(--suave); border: 2px solid var(--borde); }
.listos span.si { background: var(--verde); border-color: var(--verde); color: #fff; }
.listos i { width: 22px; height: 22px; border-radius: 7px; color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 12px; }
.espera-grande { font-size: 56px; font-weight: 800; font-style: italic; color: var(--naranjo); line-height: 1; margin: 6px 0; }
.voto-barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 57; height: 68px; overflow: hidden; display: flex; align-items: center; background: #0B2545; pointer-events: none; }
.voto-barra[hidden] { display: none; }
.voto-pista { display: flex; flex: none; white-space: nowrap; animation: voto-avance 60s linear infinite; }
.voto-pista span { padding: 0 32px; font: 600 28px/1 Poppins, system-ui, sans-serif; letter-spacing: .02em; color: rgba(250, 234, 200, .88); }
.voto-pista b { font-style: italic; font-weight: 700; color: #E8772E; }
.voto-pista i { font-style: normal; color: rgba(250, 234, 200, .35); }
@keyframes voto-avance { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .voto-pista { animation: none; } }
</style>

<script>
(() => {
"use strict";

// =====================================================================
// Utilidades
// =====================================================================
const AZUL = "#0B2545", NARANJO = "#E8772E", CREMA = "#FAEAC8", FONDO = "#F7F4F1", VERDE = "#1f9d6b", ROJO = "#d64545";
const ARENA = "#EAD9B5", ARENA_OSCURA = "#DCC79E", CALLE = "#FFFDF8";
const TAU = Math.PI * 2;
// Azar: en partidas con celulares todos usan la misma semilla, así los desafíos son los mismos.
let aleatorio = Math.random;
function sembrar(semilla) {
  let a = semilla >>> 0;
  aleatorio = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rnd = (a, b) => a + aleatorio() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const barajar = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rint(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (n) => Math.round(n).toLocaleString("es-CL");
const km = (v) => v.toFixed(1).replace(".", ",");
const reloj = (s) => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const corazones = (n, max = 3) => "♥".repeat(Math.max(0, n)) + "♡".repeat(Math.max(0, max - n));

/** Puntos al azar en [m, 1-m]² separados al menos "min" entre sí. */
function puntosSeparados(n, min, m = 0.08) {
  for (let intento = 0; intento < 60; intento++) {
    const pts = [];
    let fallos = 0;
    while (pts.length < n && fallos < 800) {
      const p = { x: rnd(m, 1 - m), y: rnd(m, 1 - m) };
      if (pts.every((q) => dist(p, q) >= min)) pts.push(p); else fallos++;
    }
    if (pts.length === n) return pts;
    min *= 0.92;
  }
  return Array.from({ length: n }, () => ({ x: rnd(m, 1 - m), y: rnd(m, 1 - m) }));
}

/** Largo de una ruta desde el depósito (cerrada: vuelve al depósito). */
function largoRuta(dep, pts, orden, cerrada) {
  let s = 0, a = dep;
  for (const i of orden) { s += dist(a, pts[i]); a = pts[i]; }
  return cerrada ? s + dist(a, dep) : s;
}

function vecinoMasCercano(dep, pts) {
  const libres = new Set(pts.map((_, i) => i)), orden = [];
  let a = dep;
  while (libres.size) {
    let mejor = -1, dm = Infinity;
    for (const i of libres) { const d = dist(a, pts[i]); if (d < dm) { dm = d; mejor = i; } }
    orden.push(mejor); libres.delete(mejor); a = pts[mejor];
  }
  return orden;
}

/** Mejora 2-opt de una ruta cerrada que parte y termina en el depósito. */
function dosOpt(dep, pts, orden) {
  const P = (k, s) => (s[k] < 0 ? dep : pts[s[k]]);
  let s = [-1, ...orden], mejora = true;
  const n = s.length;
  while (mejora) {
    mejora = false;
    for (let i = 1; i < n - 1; i++) {
      for (let k = i + 1; k < n; k++) {
        const a = P(i - 1, s), b = P(i, s), c = P(k, s), d = P((k + 1) % n, s);
        if (dist(a, c) + dist(b, d) < dist(a, b) + dist(c, d) - 1e-9) {
          s = [...s.slice(0, i), ...s.slice(i, k + 1).reverse(), ...s.slice(k + 1)];
          mejora = true;
        }
      }
    }
  }
  return s.slice(1);
}

/** Orden óptimo exacto (Held-Karp) de una ruta abierta desde el depósito. */
function rutaOptimaAbierta(dep, pts) {
  const n = pts.length, N = 1 << n;
  const dp = new Float64Array(N * n).fill(Infinity), par = new Int8Array(N * n).fill(-1);
  for (let j = 0; j < n; j++) dp[(1 << j) * n + j] = dist(dep, pts[j]);
  for (let m = 1; m < N; m++) for (let j = 0; j < n; j++) {
    if (!(m & (1 << j))) continue;
    const v = dp[m * n + j];
    if (v === Infinity) continue;
    for (let k = 0; k < n; k++) {
      if (m & (1 << k)) continue;
      const nm = m | (1 << k), c = v + dist(pts[j], pts[k]);
      if (c < dp[nm * n + k]) { dp[nm * n + k] = c; par[nm * n + k] = j; }
    }
  }
  let m = N - 1, j = 0;
  for (let k = 1; k < n; k++) if (dp[m * n + k] < dp[m * n + j]) j = k;
  const orden = [];
  while (j >= 0) { orden.push(j); const pj = par[m * n + j]; m ^= 1 << j; j = pj; }
  return orden.reverse();
}

// =====================================================================
// Dibujo
// =====================================================================
function redondeado(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Mapa estilizado: arena con calles blancas en grilla. */
function mapa(ctx, x, y, w, h, radio = 18, calles = 6) {
  ctx.save();
  redondeado(ctx, x, y, w, h, radio); ctx.fillStyle = ARENA; ctx.fill(); ctx.clip();
  const paso = Math.min(w, h) / calles, grosor = Math.max(3, paso * 0.12);
  ctx.strokeStyle = CALLE; ctx.lineWidth = grosor;
  ctx.beginPath();
  for (let gx = x + paso / 2; gx < x + w; gx += paso) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
  for (let gy = y + paso / 2; gy < y + h; gy += paso) { ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
  ctx.stroke();
  ctx.restore();
}

/** Depósito: cuadrado naranjo con una casita. */
function deposito(ctx, x, y, s) {
  ctx.save();
  ctx.shadowColor = "rgba(11,37,69,.25)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  redondeado(ctx, x - s / 2, y - s / 2, s, s, s * 0.22); ctx.fillStyle = NARANJO; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "#fff";
  const u = s / 10;
  ctx.beginPath(); ctx.moveTo(x - 3.2 * u, y - 0.2 * u); ctx.lineTo(x, y - 3.2 * u); ctx.lineTo(x + 3.2 * u, y - 0.2 * u); ctx.closePath(); ctx.fill();
  ctx.fillRect(x - 2.3 * u, y - 0.4 * u, 4.6 * u, 3.4 * u);
  ctx.fillStyle = NARANJO; ctx.fillRect(x - 0.7 * u, y + 0.9 * u, 1.4 * u, 2.1 * u);
  ctx.restore();
}

/** Camioneta vista desde arriba. ang = dirección (0 = derecha). */
function camioneta(ctx, x, y, ang, s, color = AZUL) {
  const L = s, A = s * 0.56;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.shadowColor = "rgba(0,0,0,.28)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillStyle = "#1d1d1d";
  for (const [wx, wy] of [[-0.3, -0.5], [0.28, -0.5], [-0.3, 0.5], [0.28, 0.5]]) ctx.fillRect(wx * L - L * 0.09, wy * A - A * 0.09, L * 0.18, A * 0.18);
  redondeado(ctx, -L / 2, -A / 2, L, A, A * 0.22); ctx.fillStyle = color; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "rgba(255,255,255,.92)";
  redondeado(ctx, L * 0.2, -A * 0.36, L * 0.17, A * 0.72, 3); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.28)";
  ctx.fillRect(-L * 0.4, -A * 0.3, L * 0.5, A * 0.6);
  ctx.restore();
}

/** Cliente: círculo con número (o texto). */
function cliente(ctx, x, y, r, texto = "", { fondo = "#fff", borde = AZUL, tinta } = {}) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = fondo; ctx.fill();
  ctx.lineWidth = Math.max(2.5, r * 0.18); ctx.strokeStyle = borde; ctx.stroke();
  if (texto !== "") {
    ctx.fillStyle = tinta ?? (fondo === "#fff" ? borde : "#fff");
    ctx.font = `700 ${r * 1.05}px Poppins, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(texto, x, y + r * 0.06);
  }
  ctx.restore();
}

/** Pin de ubicación con la punta en (x, y). */
function pin(ctx, x, y, s, color = NARANJO) {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
  const r = s * 0.38, cy = y - s * 0.62;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - r * 0.4, y - s * 0.25, x - r, cy + r * 0.55, x - r, cy);
  ctx.arc(x, cy, r, Math.PI, 0);
  ctx.bezierCurveTo(x + r, cy + r * 0.55, x + r * 0.4, y - s * 0.25, x, y);
  ctx.fillStyle = color; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.beginPath(); ctx.arc(x, cy, r * 0.42, 0, TAU); ctx.fillStyle = "#fff"; ctx.fill();
  ctx.restore();
}

function texto(ctx, t, x, y, size, color = AZUL, peso = 700, alinear = "center", italica = false) {
  ctx.save();
  ctx.font = `${italica ? "italic " : ""}${peso} ${size}px Poppins, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = alinear; ctx.textBaseline = "middle";
  ctx.fillText(t, x, y);
  ctx.restore();
}

/** Etiqueta tipo píldora. */
function pildora(ctx, t, x, y, size, fondo, tinta = "#fff") {
  ctx.save();
  ctx.font = `700 ${size}px Poppins, sans-serif`;
  const w = ctx.measureText(t).width + size * 1.2, h = size * 1.8;
  redondeado(ctx, x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = fondo; ctx.fill();
  ctx.fillStyle = tinta; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(t, x, y + 1);
  ctx.restore();
}

function lineaPunteada(ctx, puntos, color, ancho, guion = [10, 8], desfase = 0) {
  if (puntos.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash(guion); ctx.lineDashOffset = desfase;
  ctx.beginPath(); puntos.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke();
  ctx.restore();
}

function linea(ctx, puntos, color, ancho, alfa = 1) {
  if (puntos.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alfa; ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); puntos.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke();
  ctx.restore();
}

// Ranking de cada minijuego (top 10 con nombre), en "ruta-<id>.ranking": la biblioteca
// muestra el primero como récord en la tarjeta. Misma tabla que los otros juegos.
const MAX_RANKING = 10;
const claveRanking = (id) => `ruta-${id}.ranking`;
const escHTML = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function leerRanking(id) { try { return JSON.parse(localStorage.getItem(claveRanking(id))) || []; } catch { return []; } }
function agregarRanking(id, nombre, puntos) {
  const r = { nombre: String(nombre || "").trim().slice(0, 14) || "Anónimo", puntos: Math.round(puntos), t: Date.now() };
  try {
    const l = [...leerRanking(id), r].sort((a, b) => b.puntos - a.puntos || a.t - b.t).slice(0, MAX_RANKING);
    localStorage.setItem(claveRanking(id), JSON.stringify(l));
  } catch { /* sin almacenamiento */ }
  return r;
}
function renombrarRanking(id, t, nombre) {
  try {
    const l = leerRanking(id).map((r) => (r.t === t ? { ...r, nombre } : r));
    localStorage.setItem(claveRanking(id), JSON.stringify(l));
  } catch { /* sin almacenamiento */ }
}
function pintarRanking(el, id, resaltado, max) {
  const l = leerRanking(id).slice(0, max);
  if (!l.length) { el.innerHTML = ""; return; }
  el.innerHTML = "<h3>Ranking</h3><ol>" + l.map((r, i) =>
    `<li class="${resaltado && r.t === resaltado.t ? "tuyo" : ""}"><span class="pos">${i + 1}</span>` +
    `<span class="nombre">${escHTML(r.nombre || "Anónimo")}</span><span class="pts">${Math.round(r.puntos).toLocaleString("es-CL")}</span></li>`).join("") + "</ol>";
}

function ajustarLienzo() {
  const r = ui.area.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  E.w = Math.max(1, r.width); E.h = Math.max(1, r.height);
  ui.lienzo.width = Math.round(E.w * dpr); ui.lienzo.height = Math.round(E.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (actual && actual.redimensionar) actual.redimensionar();
  if (fase !== "jugando") dibujarCuadro();
}

function dibujarCuadro() {
  ctx.clearRect(0, 0, E.w, E.h);
  ctx.fillStyle = FONDO; ctx.fillRect(0, 0, E.w, E.h);
  if (Online_.dibujar(ctx)) { /* pantalla grande: el juego de cada celular */ }
  else if (actual) actual.dibujar(ctx);
  for (const f of E.flotantes) {
    const a = 1 - f.vida / 1.1;
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    ctx.font = `800 ${f.size}px Poppins, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineJoin = "round";
    // Siempre dentro de la pantalla, aunque nazca cerca de un borde.
    const ancho = ctx.measureText(f.t).width;
    const x = clamp(f.x, ancho / 2 + 8, Math.max(ancho / 2 + 8, E.w - ancho / 2 - 8));
    const y = Math.max(f.size, f.y - f.vida * 46);
    ctx.strokeText(f.t, x, y); ctx.fillStyle = f.color; ctx.fillText(f.t, x, y);
    ctx.restore();
  }
}

function cuadro(ahora) {
  const dt = Math.min(0.05, (ahora - anterior) / 1000 || 0);
  anterior = ahora;
  if (fase === "jugando" && actual) actual.actualizar(dt);
  if (fase === "vivo") Online_.actualizar(dt);
  E.flotantes.forEach((f) => (f.vida += dt));
  E.flotantes = E.flotantes.filter((f) => f.vida < 1.1);
  dibujarCuadro();
  if (fase === "jugando" || fase === "vivo" || E.flotantes.length) bucle = requestAnimationFrame(cuadro);
  else bucle = 0;
}
function arrancarBucle() { if (!bucle) { anterior = performance.now(); bucle = requestAnimationFrame(cuadro); } }
function pararBucle() { cancelAnimationFrame(bucle); bucle = 0; }

function abrirJuego(j) {
  actual = null;               // primero se mide la pantalla; el juego se prepara después
  ui.inicio.hidden = true; ui.juego.hidden = false;
  document.body.classList.add("jugando");
  ui.titulo.textContent = j.nombre;
  ui.introEtq.textContent = j.etiqueta; ui.introNombre.textContent = j.nombre;
  ui.introPasos.innerHTML = j.pasos.map((p, i) => `<li><span>${i + 1}</span>${p}</li>`).join("");
  E.flotantes = [];
  ajustarLienzo();
  actual = j;
  j.iniciar(E);              // vista previa detrás del panel
  E.marcador(j.marcadorInicial || "");
  fase = "intro";
  ui.fin.hidden = true; ui.intro.hidden = false;
  Online_.alAbrir();
  if (Online_.esCelular) ui.introRanking.innerHTML = "";
  else pintarRanking(ui.introRanking, j.id, null, 5);
  dibujarCuadro();
  if (!Online_.esCelular) ui.jugar.focus({ preventScroll: true });
}

function terminarJuego(puntos, stats) {
  if (fase !== "jugando") return;
  fase = "fin";
  puntos = Math.max(0, Math.round(puntos));
  const records = leerRecords(), antes = records[actual.id] || 0;
  const nuevo = puntos > antes;
  if (nuevo) guardarRecord(actual.id, puntos);
  ui.finEtq.textContent = actual.nombre;
  ui.finPuntos.textContent = fmt(puntos);
  ui.finRecord.hidden = !nuevo;
  ui.finRecordAnt.textContent = nuevo ? (antes ? `Tu récord anterior era ${fmt(antes)}` : "") : `Tu récord: ${fmt(antes)}`;
  ui.finStats.innerHTML = stats.map(([v, l]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join("");
  ui.finTitular.innerHTML = actual.titular ? actual.titular() : "";
  ui.finDato.innerHTML = actual.dato;
  ultimoPuntaje = puntos;

  if (Online_.esCelular) ui.finRanking.innerHTML = "";
  else pintarRanking(ui.finRanking, actual.id, null, MAX_RANKING);

  setTimeout(() => { if (fase === "fin") { ui.fin.hidden = false; ui.otra.focus({ preventScroll: true }); } }, 450);
}

// 1) ¿Cuál es más corta?
// =====================================================================
const GR_MARCA = '<span class="gr-marca">GoodRoute</span>';
const juegoCorta = {
  id: "corta", nombre: "¿Cuál es más corta?", etiqueta: "Ojo de optimizador", duracion: "40 s",
  descripcion: "Dos rutas, los mismos clientes. Toca la más corta antes de que se acabe el tiempo.",
  pasos: [
    "Verás dos mapas con el mismo depósito y los mismos clientes, pero visitados en distinto orden.",
    "Toca la ruta que creas más corta. Cada acierto seguido suma bono de racha.",
    "Si te equivocas pierdes 3 segundos. Cada ronda es un nivel más: más clientes y rutas más parejas.",
  ],
  dato: `Pocos kilómetros de más por técnico suman mucho en toda la flota. ${GR_MARCA} compara miles de rutas y elige la más corta.`,
  titularGrupo: `Con rutas cada vez más parejas, a ojo cuesta elegir. ${GR_MARCA} mide cada ruta y siempre elige la más corta.`,
  titular() {
    if (!this.aciertos && !this.errores) return "";
    const dif = `${this.menorDif}%`;
    return this.errores
      ? `Elegiste la ruta más larga ${this.errores === 1 ? "una vez" : `${this.errores} veces`}. ${GR_MARCA} mide cada ruta y nunca elige la larga, aunque se diferencien en un ${dif}.`
      : `Acertaste las ${this.aciertos} rondas, hasta con rutas que se diferenciaban en un ${dif}. ${GR_MARCA} lo hace con miles de rutas, en milisegundos.`;
  },
  KM_MAPA: 8,                // lado del mapa en km
  marcadorInicial: `⏱ 0:40<span class="sep">·</span>Nivel 1<span class="sep">·</span>0 pts`,

  iniciar(E) {
    this.E = E; this.tiempo = 40; this.puntos = 0; this.racha = 0; this.mejorRacha = 0;
    this.aciertos = 0; this.errores = 0; this.nivel = 0; this.menorDif = null;
    this.redimensionar(); this.nuevaRonda();
  },

  nuevaRonda() {
    // Dificultad por nivel: más clientes (5 → 9) y rutas cada vez más parejas.
    const n = Math.min(9, 5 + Math.floor(this.nivel / 2));
    const pts = puntosSeparados(n + 1, 0.17, 0.06);
    const dep = pts.pop();
    const corta = dosOpt(dep, pts, vecinoMasCercano(dep, pts));
    const Lc = largoRuta(dep, pts, corta, true);
    // Diferencia buscada: se achica con el nivel.
    const objetivo = Math.max(0.02, 0.26 - this.nivel * 0.03);
    let mejor = null;
    for (let k = 0; k < 400; k++) {
      const o = corta.slice();
      if (aleatorio() < 0.55) { const i = rint(0, n - 2), j = rint(i + 1, n - 1); o.splice(i, j - i + 1, ...o.slice(i, j + 1).reverse()); }
      else { const i = rint(0, n - 1); let j = rint(0, n - 1); if (j === i) j = (i + 1) % n; [o[i], o[j]] = [o[j], o[i]]; }
      const r = largoRuta(dep, pts, o, true) / Lc - 1;
      if (r < 0.02) continue;
      if (!mejor || Math.abs(r - objetivo) < Math.abs(mejor.r - objetivo)) mejor = { o, r };
    }
    if (!mejor) { this.nivel++; return this.nuevaRonda(); }
    const cortaArriba = aleatorio() < 0.5;
    this.ronda = {
      dep, pts,
      rutas: cortaArriba ? [corta, mejor.o] : [mejor.o, corta],
      km: [0, 1].map((k) => largoRuta(dep, pts, (cortaArriba ? [corta, mejor.o] : [mejor.o, corta])[k], true) * this.KM_MAPA),
      correcta: cortaArriba ? 0 : 1,
      elegida: -1, espera: 0,
    };
  },

  redimensionar() {
    const { w, h } = this.E, m = 12, horiz = w > h * 1.05;
    let pw, ph, pos;
    if (horiz) { pw = (w - 3 * m) / 2; ph = h - 2 * m; pos = [[m, m], [2 * m + pw, m]]; }
    else { pw = w - 2 * m; ph = (h - 3 * m) / 2; pos = [[m, m], [m, 2 * m + ph]]; }
    this.paneles = pos.map(([x, y]) => {
      const cab = 34, s = Math.max(60, Math.min(pw - 20, ph - cab - 12));
      return { x, y, w: pw, h: ph, mapa: { x: x + (pw - s) / 2, y: y + cab + (ph - cab - s) / 2, s } };
    });
  },

  aPx(p, pan) { const s = pan.mapa.s; return { x: pan.mapa.x + p.x * s, y: pan.mapa.y + p.y * s }; },
  VISTA: ["ronda", "tiempo", "puntos"],
  estadisticas() { return [[this.aciertos, "aciertos"], [this.errores, "errores"], [this.mejorRacha, "mejor racha"]]; },
  adelantar(dt) { if (this.ronda && this.ronda.elegida < 0) this.tiempo -= dt; },

  actualizar(dt) {
    const r = this.ronda;
    if (r.elegida >= 0) { r.espera -= dt; if (r.espera <= 0) { this.nivel++; this.nuevaRonda(); } }
    else this.tiempo -= dt;      // el reloj se detiene mientras se muestra la respuesta
    this.E.marcador(`⏱ ${reloj(this.tiempo)}<span class="sep">·</span>Nivel ${this.nivel + 1}<span class="sep">·</span>${fmt(this.puntos)} pts`);
    if (this.tiempo <= 0) this.E.terminar(this.puntos, [
      [this.aciertos, "aciertos"], [this.errores, "errores"], [this.mejorRacha, "mejor racha"],
    ]);
  },

  elegir(k) {
    const r = this.ronda;
    if (r.elegida >= 0) return;
    r.elegida = k; r.espera = 1.35;
    const dif = Math.max(1, Math.round((Math.max(...r.km) / Math.min(...r.km) - 1) * 100));
    this.menorDif = this.menorDif == null ? dif : Math.min(this.menorDif, dif);
    const pan = this.paneles[k], cx = pan.x + pan.w / 2, cy = pan.y + pan.h / 2;
    if (k === r.correcta) {
      const bono = 20 * this.racha, pts = 100 + bono;
      this.puntos += pts; this.racha++; this.aciertos++;
      this.mejorRacha = Math.max(this.mejorRacha, this.racha);
      this.E.flotar(cx, cy, bono ? `+${pts} · racha ×${this.racha}` : `+${pts}`, VERDE, 26);
    } else {
      this.tiempo -= 3; this.racha = 0; this.errores++;
      this.E.flotar(cx, cy, "−3 s", ROJO, 30); this.E.vibrar();
    }
  },

  tocar(x, y) {
    const k = this.paneles.findIndex((p) => x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h);
    if (k >= 0) this.elegir(k);
  },
  tecla(t) {
    if (t === "ArrowLeft" || t === "ArrowUp" || t === "a" || t === "1") this.elegir(0);
    if (t === "ArrowRight" || t === "ArrowDown" || t === "b" || t === "2") this.elegir(1);
  },

  dibujar(ctx) {
    const r = this.ronda;
    this.paneles.forEach((pan, k) => {
      const resp = r.elegida >= 0;
      let borde = "transparent";
      if (resp && k === r.correcta) borde = VERDE;
      else if (resp && k === r.elegida) borde = ROJO;
      ctx.save();
      ctx.shadowColor = "rgba(11,37,69,.08)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
      redondeado(ctx, pan.x, pan.y, pan.w, pan.h, 20); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.restore();
      if (borde !== "transparent") { redondeado(ctx, pan.x + 2, pan.y + 2, pan.w - 4, pan.h - 4, 19); ctx.lineWidth = 4; ctx.strokeStyle = borde; ctx.stroke(); }
      texto(ctx, `Ruta ${k ? "B" : "A"}`, pan.x + 16, pan.y + 19, 16, AZUL, 800, "left", true);
      if (resp) pildora(ctx, `${km(r.km[k])} km`, pan.x + pan.w - 58, pan.y + 19, 14, k === r.correcta ? VERDE : k === r.elegida ? ROJO : AZUL);
      const mp = pan.mapa;
      mapa(ctx, mp.x, mp.y, mp.s, mp.s, 16, 6);
      const dep = this.aPx(r.dep, pan), orden = r.rutas[k];
      const ruta = [dep, ...orden.map((i) => this.aPx(r.pts[i], pan)), dep];
      linea(ctx, ruta, "#fff", Math.max(6, mp.s * 0.03));
      linea(ctx, ruta, resp && k === r.correcta ? VERDE : AZUL, Math.max(3.5, mp.s * 0.016));
      const rc = clamp(mp.s * 0.045, 10, 16);
      orden.forEach((i, n) => { const p = this.aPx(r.pts[i], pan); cliente(ctx, p.x, p.y, rc, String(n + 1)); });
      deposito(ctx, dep.x, dep.y, rc * 2.3);
    });
  },
};

const juegoMemoria = {
  id: "memoria", nombre: "Memoriza la ruta", etiqueta: "Orden de visitas", duracion: "3 vidas",
  descripcion: "Mira cómo la camioneta recorre la ruta óptima y repite el orden de visitas.",
  pasos: [
    "Una camioneta recorre la ruta óptima y va numerando a los clientes.",
    "Cuando termine, toca los clientes en ese mismo orden.",
    "Cada nivel suma un cliente. Si te equivocas pierdes una vida y vuelves a ver la ruta.",
  ],
  dato: "Ningún técnico debería tener que memorizar su ruta: el optimizador calcula el orden y lo entrega listo, y lo recalcula cuando algo cambia.",
  marcadorInicial: `${corazones(3)}<span class="sep">·</span>Nivel 1<span class="sep">·</span>0 pts`,

  iniciar(E) {
    this.E = E; this.vidas = 3; this.puntos = 0; this.nivel = 1; this.completadas = 0; this.mejorN = 0;
    this.redimensionar(); this.nuevoNivel();

  nuevoNivel() {
    const n = Math.min(10, 2 + this.nivel);
    const pts = puntosSeparados(n + 1, n > 7 ? 0.15 : 0.19, 0.08);
    this.dep = pts.pop(); this.clientes = pts;
    this.orden = rutaOptimaAbierta(this.dep, pts);
    this.repetir();
  },

  /** Vuelve a mostrar el recorrido (al empezar el nivel o después de un error). */
  repetir() {
    this.recorrido = [this.dep, ...this.orden.map((i) => this.clientes[i])];
    this.tramos = [];
    let total = 0;
    for (let k = 1; k < this.recorrido.length; k++) { const d = dist(this.recorrido[k - 1], this.recorrido[k]); this.tramos.push(d); total += d; }
    this.total = total;
    this.vel = Math.max(0.45, total / 4.2);         // la animación dura a lo más ~4 s
    this.t = 0; this.tocados = []; this.error = null;
    this.estado = "mirar"; this.espera = 0;
  },

  redimensionar() {
    const { w, h } = this.E, cab = 44, m = 14;
    const s = Math.max(80, Math.min(w - 2 * m, h - cab - 2 * m));
    this.mapa = { x: (w - s) / 2, y: cab + (h - cab - s) / 2, s, cab };
  },
  aPx(p) { const { x, y, s } = this.mapa; return { x: x + (0.05 + p.x * 0.9) * s, y: y + (0.05 + p.y * 0.9) * s }; },

  /** Posición de la camioneta tras recorrer "t" (en unidades del mapa). */
  enRecorrido(t) {
    let resto = t;
    for (let k = 0; k < this.tramos.length; k++) {
      if (resto <= this.tramos[k]) {
        const a = this.recorrido[k], b = this.recorrido[k + 1], f = this.tramos[k] ? resto / this.tramos[k] : 1;
        return { p: { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }, k, ang: Math.atan2(b.y - a.y, b.x - a.x) };
      }
      resto -= this.tramos[k];
    }
    const n = this.recorrido.length, a = this.recorrido[n - 2], b = this.recorrido[n - 1];
    return { p: b, k: this.tramos.length, ang: Math.atan2(b.y - a.y, b.x - a.x) };
  },

  actualizar(dt) {
    if (this.estado === "mirar") {
      this.t += this.vel * dt;
      if (this.t >= this.total) { this.t = this.total; this.estado = "pausa"; this.espera = 0.7; }
    } else if (this.estado === "pausa") {
      this.espera -= dt;
      if (this.espera <= 0) { this.estado = "turno"; this.E.flotar(this.E.w / 2, this.mapa.y + this.mapa.s / 2, "¡Tu turno!", NARANJO, 30); }
    } else if (this.estado === "error" || this.estado === "completo" || this.estado === "fin") {
      this.espera -= dt;
      if (this.espera <= 0) {
        if (this.estado === "error") this.repetir();
        else if (this.estado === "completo") { this.nivel++; this.nuevoNivel(); }
        else this.E.terminar(this.puntos, [[this.nivel, "nivel alcanzado"], [this.completadas, "rutas completas"], [this.mejorN, "clientes en tu mejor ruta"]]);
      }
    }
    this.E.marcador(`${corazones(this.vidas)}<span class="sep">·</span>Nivel ${this.nivel}<span class="sep">·</span>${fmt(this.puntos)} pts`);
  },

  tocar(x, y) {
    if (this.estado !== "turno") return;
    const rc = this.radio();
    let mejor = -1, dm = Math.max(40, rc * 2.2);
    this.clientes.forEach((c, i) => { const p = this.aPx(c), d = Math.hypot(p.x - x, p.y - y); if (d < dm) { dm = d; mejor = i; } });
    if (mejor < 0 || this.tocados.includes(mejor)) return;
    const esperado = this.orden[this.tocados.length], p = this.aPx(this.clientes[mejor]);
    if (mejor === esperado) {
      this.tocados.push(mejor);
      if (this.tocados.length === this.orden.length) {
        const n = this.orden.length, pts = 50 * n;
        this.puntos += pts; this.completadas++; this.mejorN = Math.max(this.mejorN, n);
        this.E.flotar(this.E.w / 2, this.mapa.y + this.mapa.s / 2, `¡Ruta completa! +${pts}`, VERDE, 26);
        this.estado = "completo"; this.espera = 1.2;
      }
    } else {
      this.error = mejor; this.vidas--; this.E.vibrar(120);
      this.E.flotar(p.x, p.y - 20, "−1 vida", ROJO, 24);
      this.estado = this.vidas > 0 ? "error" : "fin"; this.espera = 1.2;
    }
  },

  radio() { return clamp(this.mapa.s * 0.045, 14, 22); },
  VISTA: ["dep", "clientes", "orden", "recorrido", "tramos", "total", "vel", "t", "tocados", "error", "estado", "vidas", "nivel", "puntos"],
  LISTAS: ["tocados"],
  estadisticas() { return [[this.nivel, "nivel alcanzado"], [this.completadas, "rutas completas"], [this.mejorN, "clientes en tu mejor ruta"]]; },
  adelantar(dt) { if (this.estado === "mirar") this.t = Math.min(this.total, this.t + this.vel * dt); },

  dibujar(ctx) {
    const { x, y, s, cab } = this.mapa, rc = this.radio();
    const msg = { mirar: "Observa el orden de visitas…", pausa: "Observa el orden de visitas…", turno: "Toca los clientes en el mismo orden", error: "¡Ups! Mira de nuevo", completo: "¡Muy bien!", fin: "Sin vidas" }[this.estado] || "";
    texto(ctx, msg, this.E.w / 2, cab / 2 + 2, 17, this.estado === "turno" ? NARANJO : AZUL, 700, "center", true);
    mapa(ctx, x, y, s, s, 20, 7);
    const mirando = this.estado === "mirar" || this.estado === "pausa";
    if (mirando) {
      const pos = this.enRecorrido(this.t);
      const hecho = [...this.recorrido.slice(0, pos.k + 1), pos.p].map((p) => this.aPx(p));
      lineaPunteada(ctx, hecho, NARANJO, Math.max(4, s * 0.012), [10, 8], -performance.now() / 40);
    }
    this.clientes.forEach((c, i) => {
      const p = this.aPx(c), k = this.orden.indexOf(i);
      if (mirando) {
        const visto = this.enRecorrido(this.t).k > k || (this.t >= this.total);
        cliente(ctx, p.x, p.y, rc, visto ? String(k + 1) : "", visto ? { fondo: AZUL, borde: AZUL } : {});
      } else if (this.tocados.includes(i)) {
        cliente(ctx, p.x, p.y, rc, String(this.tocados.indexOf(i) + 1), { fondo: VERDE, borde: VERDE });
      } else if (this.error === i) {
        cliente(ctx, p.x, p.y, rc, "✕", { fondo: ROJO, borde: ROJO });
      } else cliente(ctx, p.x, p.y, rc, "");
    });
    const d = this.aPx(this.dep);
    deposito(ctx, d.x, d.y, rc * 2.2);
    if (mirando) { const pos = this.enRecorrido(this.t), q = this.aPx(pos.p); camioneta(ctx, q.x, q.y, pos.ang, rc * 2.4); }
  },
};

  { nombre: "Morado", color: "#7c54c9" }, { nombre: "Rosa", color: "#c23b7a" }, { nombre: "Turquesa", color: "#0f8b8d" },

const votoHTML = () => `<div class="voto-pista">${Array.from({ length: 2 }, () => Array.from({ length: 14 }, () => "<span>Vota <b>GoodRoute</b></span><i>·</i>").join("")).join("")}</div>`;
const VOTO_ALTO = 68;
const Online_ = (() => {
  const O = window.Online;
  const SALA = PARAMS.get("sala"), YO = Number(PARAMS.get("j")) - 1;
  const esCelular = !!(SALA && JUGADORES[YO] && DIRECTO);
  let nJug = 1, sala = null, jug = [], estadoSala = "", autoInicio = 0, semilla = 0;
  let conexion = null, envio = 0, ultimoEnviado = -1, ultimoVivo = null;
  let preparados = {}, vistas = [], envioVista = 0, ultimaVista = "";
  let cortada = false, porPantalla = false;   // en el celular: la pantalla terminó la partida
  let nombresPodio = {}, cierrePodio = 0, nombreEnviado = false;
  const SEGUNDOS_NOMBRE = 120;
  const CAB = 42;                 // alto de la cabecera de cada cuadro

  /** Foto del estado de un juego, con números redondeados para que pese poco. */
  function foto(j) {
    const v = j.ver ? j.ver() : Object.fromEntries(j.VISTA.map((k) => [k, j[k]]));
    return JSON.parse(JSON.stringify(v, (k, x) => (typeof x === "number" ? Math.round(x * 1000) / 1000 : x)));
  }

  // ---------- Pantalla grande ----------
  function pintarNumeros() {
    ui.numJug.innerHTML = [1, 2, 3, 4, 5, 6].map((n) => `<button type="button" data-n="${n}" aria-pressed="${n === nJug}">${n}</button>`).join("");
    const motivo = O ? O.motivoNoDisponible() : "No se pudo cargar la conexión.";
    ui.celulares.disabled = !!motivo;

  }
  ui.numJug.addEventListener("click", (e) => { const b = e.target.closest("button[data-n]"); if (b) { nJug = Number(b.dataset.n); pintarNumeros(); } });

  async function abrirSala() {
    if (!O || !O.disponible() || !actual) return;
    ui.intro.hidden = true; ui.sala.hidden = false;
    ui.salaEtq.textContent = actual.nombre; ui.qrGrilla.innerHTML = ""; ui.salaCodigo.textContent = "";
    ui.empezarSala.disabled = true; ui.empezarSala.textContent = "Conectando…";
    fase = "sala";
    E.marcador(`📱 ${nJug} ${nJug === 1 ? "jugador" : "jugadores"}`);
    try {
      sala = await O.crearSala("ruta-" + actual.id, nJug, { control: `index.html?juego=${actual.id}` });
      const actualizarQR = await O.pintarSala(ui.qrGrilla, sala, JUGADORES.slice(0, nJug));
      ui.salaCodigo.textContent = `Sala ${sala.codigo}`;
      jug = JUGADORES.slice(0, nJug).map(() => ({ conectado: false, puntos: 0, listo: false, stats: null }));
      sala.alJugadores((v) => {
        jug.forEach((j, p) => (j.conectado = !!v[p]));
        actualizarQR(v); revisarSala(); if (estadoSala === "jugar") pintarVivo();
      });
      sala.alEntrada(recibir);
      // "¡Estoy listo!" de cada celular, y la foto de su partida.
      sala.alValor("listos", (v) => { preparados = v || {}; revisarSala(); });
      // Una escucha por jugador: así solo se descarga la foto que cambió.
      jug.forEach((_, p) => sala.alValor(`vistas/${p}`, (f) => {
        if (!actual || !f) return;
        const inst = vistas[p] ||= Object.create(actual);
        Object.assign(inst, f);
        for (const l of actual.LISTAS || []) if (!Array.isArray(inst[l])) inst[l] = inst[l] ? Object.values(inst[l]) : [];
        if (inst.alVer) inst.alVer();
        inst.recibida = true;
      }));
      estadoSala = "sala"; revisarSala();
    } catch (e) {

      ui.modoNota.textContent = "No se pudo conectar: " + (e.message || e) + " Puedes jugar en esta pantalla.";
    }
  }

  const todos = () => jug.length && jug.every((j) => j.conectado);
  const todosListos = () => todos() && jug.every((_, p) => preparados[p]);
  function revisarSala() {
    if (estadoSala !== "sala") return;
    clearTimeout(autoInicio);
    const n = jug.filter((j) => j.conectado).length, nl = jug.filter((_, p) => preparados[p] && jug[p].conectado).length;
    // Cuando están todos conectados, se ve quién confirmó en su celular.
    const zona = ui.qrGrilla.querySelector(".qr-listos");
    if (zona) zona.innerHTML = todos()
      ? `${todosListos() ? "¡Todos listos!" : "Confirmen en su celular: ¿están listos?"}<div class="listos">${jug.map((_, p) =>
          `<span class="${preparados[p] ? "si" : ""}"><i style="background:${JUGADORES[p].color}">${p + 1}</i>${JUGADORES[p].nombre}${preparados[p] ? " ✓" : "…"}</span>`).join("")}</div>`
      : "";
    if (todosListos()) {
      ui.empezarSala.disabled = false; ui.empezarSala.textContent = "¡Empezar!";
      autoInicio = setTimeout(() => { if (estadoSala === "sala" && todosListos()) empezarPartida(); }, 1500);
    } else if (todos()) {
      ui.empezarSala.disabled = true; ui.empezarSala.textContent = `Esperando confirmación… ${nl} de ${nJug} listos`;
    } else { ui.empezarSala.disabled = true; ui.empezarSala.textContent = `Esperando jugadores… ${n} de ${nJug}`; }
  }

  function empezarPartida() {
    clearTimeout(autoInicio);
    semilla = Math.floor(Math.random() * 2 ** 31);
    estadoSala = "jugar";
    jug.forEach((j) => { j.puntos = 0; j.listo = false; j.stats = null; });
    vistas = [];
    ui.sala.hidden = true; ui.vivo.hidden = true; ui.terminarVivo.hidden = false;
    ui.votoBarra.innerHTML = votoHTML(); ui.votoBarra.hidden = false;
    ui.vivoEtq.textContent = actual.nombre; ui.vivoTitulo.textContent = "En vivo";
    ui.vivoSub.textContent = "Cada uno juega en su celular. ¡Miren el marcador!";
    ui.vivoDato.hidden = true; ui.vivoBotones.hidden = false; ui.podioBotones.hidden = true;
    fase = "vivo";
    E.marcador(`📱 En vivo · ${nJug} ${nJug === 1 ? "jugador" : "jugadores"}`);
    sala.publicar("vivo", { fase: "jugar", semilla, juego: actual.id });
    pintarVivo();
    arrancarBucle();             // la pantalla dibuja en vivo el juego de cada celular
  }

  function recibir(m) {
    const p = Number(m.p), j = jug[p];
    if (!j || estadoSala !== "jugar") return;
    if (m.tipo === "puntos") j.puntos = Math.max(0, Math.round(m.puntos || 0));
    else if (m.tipo === "fin") { j.puntos = Math.max(0, Math.round(m.puntos || 0)); j.listo = true; j.stats = m.stats || null; }
    pintarVivo();
    if (jug.every((x) => x.listo || !x.conectado)) setTimeout(() => { if (estadoSala === "jugar") podio(); }, 900);
  }

  function orden() { return jug.map((j, p) => ({ ...j, p })).sort((a, b) => b.puntos - a.puntos || a.p - b.p); }
  function pintarVivo(final = false) {
    ui.vivoLista.innerHTML = orden().map((j, k) => {
      const J = JUGADORES[j.p];
      const estado = final ? (j.stats ? j.stats.map((s) => `${s[0]} ${s[1]}`).join(" · ") : "") :
        j.listo ? '<span class="listo">✓ Terminó</span>' : j.conectado ? "Jugando…" : '<span class="fuera">Desconectado</span>';
      return `<li class="${k === 0 && j.puntos > 0 ? "primero" : ""}"><span class="pos">${k + 1}º</span>
        <span class="num" style="background:${J.color}">${j.p + 1}</span>
        <span class="quien">${escHTML(nombresPodio[j.p] || J.nombre)}<small>${estado}</small></span><span class="pts">${fmt(j.puntos)}</span></li>`;
    }).join("");
  }

  function podio() {
    if (estadoSala !== "jugar") return;
    estadoSala = "podio";
    // El puntaje más reciente de cada uno (la foto de su partida llega más seguido que el puntaje).
    jug.forEach((j, p) => { const v = vistas[p]; if (v && v.recibida) j.puntos = Math.max(j.puntos, Math.round(v.puntos || 0)); });
    const o = orden(), mejor = o[0];
    nombresPodio = {};
    const tituloPodio = () => { ui.vivoTitulo.textContent = o.length > 1 && mejor.puntos > 0 ? `¡Gana ${nombresPodio[mejor.p] || JUGADORES[mejor.p].nombre}!` : "¡Terminó!"; };
    tituloPodio();
    ui.vivoSub.textContent = `${fmt(mejor.puntos)} puntos`;
    pintarVivo(true);
    ui.vivoDatoTit.innerHTML = actual.titularGrupo || "";
    ui.vivoDatoTxt.innerHTML = actual.dato; ui.vivoDato.hidden = false;
    ui.vivoBotones.hidden = true; ui.podioBotones.hidden = false;
    ui.vivo.hidden = false; ui.terminarVivo.hidden = true;
    // El mejor puntaje queda como récord de este juego (lo muestra la biblioteca).
    if (mejor && mejor.puntos > (leerRecords()[actual.id] || 0)) guardarRecord(actual.id, mejor.puntos);
    const ganador = mejor && mejor.puntos > 0 ? mejor : null;
    const vivo = { fase: "podio", podio: o.map((j) => ({ p: j.p, puntos: j.puntos })), pideNombre: ganador ? ganador.p : -1 };
    ui.pideNombre.hidden = !ganador;
    if (!ganador) { sala.cerrar(vivo); sala = null; return; }
    ui.pideNombre.innerHTML = `<i style="background:${JUGADORES[ganador.p].color}">${ganador.p + 1}</i>${JUGADORES[ganador.p].nombre}: escribe tu nombre en el celular para el ranking.`;
    const id = actual.id, registro = agregarRanking(id, JUGADORES[ganador.p].nombre, ganador.puntos);
    const esta = sala;
    esta.publicar("vivo", vivo);
    const terminarSala = () => { clearTimeout(cierrePodio); if (sala === esta) { esta.cerrar(); sala = null; } };
    esta.alValor("nombres", (v) => {
      const n = v && typeof v[ganador.p] === "string" ? v[ganador.p].trim().slice(0, 14) : "";
      if (!n || sala !== esta) return;
      nombresPodio[ganador.p] = n;
      renombrarRanking(id, registro.t, n);
      tituloPodio(); pintarVivo(true);
      ui.pideNombre.innerHTML = `<i style="background:${JUGADORES[ganador.p].color}">${ganador.p + 1}</i>${escHTML(n)} quedó en el ranking.`;
      Promise.resolve(esta.publicar("vivo", { ...vivo, nombreOk: n })).catch(() => {}).finally(terminarSala);
    });
    clearTimeout(cierrePodio);
    cierrePodio = setTimeout(terminarSala, SEGUNDOS_NOMBRE * 1000);
  }

  function cerrar() {
    clearTimeout(autoInicio); clearTimeout(cierrePodio);
    if (sala) sala.cerrar();
    sala = null; estadoSala = ""; preparados = {}; vistas = [];
    ui.sala.hidden = true; ui.vivo.hidden = true; ui.terminarVivo.hidden = true;
    ui.votoBarra.hidden = true;
  }

  // ---------- Pantalla grande: un cuadro por jugador con su partida en vivo ----------
  function cuadros() {
    const n = jug.length, g = 10, W = E.w, H = E.h - (ui.votoBarra.hidden ? 0 : VOTO_ALTO);
    let mejor = null;
    for (let cols = 1; cols <= n; cols++) {
      const filas = Math.ceil(n / cols);
      const w = (W - g * (cols + 1)) / cols, h = (H - g * (filas + 1)) / filas;
      const valor = Math.min(w, (h - CAB) * 1.15);
      if (!mejor || valor > mejor.valor) mejor = { cols, w, h, valor };
    }
    return jug.map((_, p) => ({ x: g + (p % mejor.cols) * (mejor.w + g), y: g + Math.floor(p / mejor.cols) * (mejor.h + g), w: mejor.w, h: mejor.h }));
  }

  function dibujarVivo(ctx) {
    if (!(estadoSala === "jugar" || estadoSala === "podio") || !actual) return false;
    ctx.fillStyle = "#e9e3dc"; ctx.fillRect(0, 0, E.w, E.h);
    cuadros().forEach((r, p) => {
      const J = JUGADORES[p], j = jug[p], inst = vistas[p];
      ctx.save();
      redondeado(ctx, r.x, r.y, r.w, r.h, 18); ctx.fillStyle = FONDO; ctx.fill();
      ctx.clip();
      if (inst && inst.recibida) {
        // El juego del celular, dibujado con su mismo código en este cuadro.
        inst.E = { w: r.w, h: r.h - CAB, flotar() {}, vibrar() {}, marcador() {}, terminar() {} };
        ctx.save(); ctx.translate(r.x, r.y + CAB);
        try { inst.redimensionar(); inst.dibujar(ctx); } catch { /* foto incompleta: se dibuja en la siguiente */ }
        ctx.restore();
      } else texto(ctx, j.conectado ? "Esperando su partida…" : "Desconectado", r.x + r.w / 2, r.y + r.h / 2, 16, "#6b7280", 600);
      if (j.listo) {
        ctx.fillStyle = "rgba(247,244,241,.72)"; ctx.fillRect(r.x, r.y + CAB, r.w, r.h - CAB);
        texto(ctx, "✓ Terminó", r.x + r.w / 2, r.y + r.h / 2, 26, VERDE, 800, "center", true);
      }
      // Cabecera: color, nombre y puntos.
      ctx.fillStyle = J.color; ctx.fillRect(r.x, r.y, r.w, CAB);
      texto(ctx, `${p + 1}`, r.x + 22, r.y + CAB / 2, 20, "#fff", 800);
      texto(ctx, J.nombre, r.x + 40, r.y + CAB / 2, 17, "#fff", 700, "left", true);
      texto(ctx, `${fmt(inst && inst.recibida ? Math.max(j.puntos, Math.round(inst.puntos || 0)) : j.puntos)} pts`, r.x + r.w - 14, r.y + CAB / 2, 18, "#fff", 800, "right", true);
      ctx.restore();
      redondeado(ctx, r.x + 1.5, r.y + 1.5, r.w - 3, r.h - 3, 17); ctx.lineWidth = 3; ctx.strokeStyle = J.color; ctx.stroke();
    });
    return true;
  }

  ui.celulares.addEventListener("click", abrirSala);
  ui.empezarSala.addEventListener("click", () => { if (estadoSala === "sala" && todosListos()) empezarPartida(); });
  $("btn-sala-volver").addEventListener("click", () => { cerrar(); fase = "intro"; ui.intro.hidden = false; pintarNumeros(); });
  $("btn-terminar").addEventListener("click", podio);
  ui.terminarVivo.addEventListener("click", podio);
  $("btn-otra-cel").addEventListener("click", () => { cerrar(); fase = "intro"; ui.intro.hidden = false; pintarNumeros(); });
  $("btn-otros-cel").addEventListener("click", () => {
    cerrar();
    try { if (window.parent !== window && window.parent.document) { window.parent.location.hash = ""; return; } } catch { /* sigue abajo */ }
    location.href = "../index.html";
  });

  // ---------- Celular ----------
  async function unirse() {
    const J = JUGADORES[YO];
    ui.titulo.innerHTML = `<span class="yo" style="background:${J.color}">${YO + 1}</span>${J.nombre}`;
    document.querySelector('meta[name="theme-color"]').content = J.color;
    $("btn-volver").hidden = true;
    ui.introModos.hidden = true; ui.introEspera.hidden = false;
    ui.jugar.hidden = true;
    ui.introEspera.textContent = "Conectando con la pantalla…";
    const motivo = O ? O.motivoNoDisponible() : "No se pudo cargar la conexión.";
    if (motivo) { ui.introEspera.textContent = motivo; return; }
    try { conexion = await O.unirse(SALA, YO); } catch (e) { ui.introEspera.textContent = e.message || String(e); return; }
    ui.introEspera.innerHTML = `Eres el jugador <b>${YO + 1}</b> · ${J.nombre}.<br>Lee cómo se juega y, cuando estés preparado, confirma:`;
    ui.listo.hidden = false;
    conexion.escuchar("vivo", (v) => {
      if (!v) { if (ultimoVivo && ultimoVivo.fase !== "podio") ui.introEspera.textContent = "La partida terminó."; return; }
      const antes = ultimoVivo; ultimoVivo = v;
      if (v.fase === "jugar" && (!antes || antes.fase !== "jugar")) cuentaRegresiva(v.semilla);
      if (v.fase === "podio") { cortar(); mostrarPuesto(v.podio, v); }
    });
  }

  ui.listo.addEventListener("click", () => {
    if (!conexion) return;
    conexion.marcar("listos", true);
    ui.listo.hidden = true;
    ui.introEspera.innerHTML = `<span class="espera-grande">✓ ¡Listo!</span><br>Esperando a que los demás confirmen…`;
    try { navigator.vibrate && navigator.vibrate(30); } catch { /* no disponible */ }
  });

  /** La pantalla terminó la partida: el juego se detiene y no se puede seguir jugando. */
  function cortar() {
    if (cortada) return;
    cortada = true;
    ui.listo.hidden = true;
    clearInterval(envio); clearInterval(envioVista);
    if (fase === "jugando" && actual) {
      porPantalla = true;
      terminarJuego(actual.puntos || 0, actual.estadisticas ? actual.estadisticas() : []);
    } else if (fase === "intro") {
      ui.introEspera.innerHTML = "<b>La partida terminó.</b><br>Para jugar otra, escanea un QR nuevo en la pantalla.";
    }
  }

  async function cuentaRegresiva(s) {
    ui.listo.hidden = true;
    for (const n of [3, 2, 1]) { ui.introEspera.innerHTML = `<span class="espera-grande">${n}</span><br>¡Prepárate!`; await new Promise((ok) => setTimeout(ok, 800)); }
    if (cortada) return;          // la pantalla terminó la partida durante la cuenta
    sembrar(s);
    empezar();
    // El puntaje se manda seguido a la pantalla grande.
    clearInterval(envio);
    envio = setInterval(() => {
      if (fase !== "jugando" || !actual) return;
      const pts = Math.round(Math.max(0, actual.puntos || 0));
      if (pts !== ultimoEnviado) { ultimoEnviado = pts; conexion.enviar({ tipo: "puntos", puntos: pts }); }
    }, 500);
    // Y la foto de su partida, para que la vean en la pantalla grande.
    clearInterval(envioVista);
    envioVista = setInterval(mandarVista, 150);
  }

  function mandarVista() {
    if (!actual || !(fase === "jugando" || fase === "fin")) return;
    const v = foto(actual), t = JSON.stringify(v);
    if (t === ultimaVista) return;
    ultimaVista = t;
    conexion.marcar("vistas", v);
  }

  function mostrarPuesto(podio, v) {
    const k = (podio || []).findIndex((x) => x.p === YO);
    if (k < 0) return;
    const titulo = (porPantalla ? "La partida se terminó desde la pantalla.<br>" : "") +
      (podio.length > 1 ? `<b>${k === 0 ? "¡Ganaste!" : `Quedaste ${k + 1}º de ${podio.length}`}</b>` : "<b>¡Bien jugado!</b>");
    const pide = v && v.pideNombre === YO;
    if (!pide) { ui.finCelular.innerHTML = titulo; return; }
    if (v.nombreOk) { ui.finCelular.innerHTML = `${titulo}<p class="nombre-ok">✓ ${escHTML(v.nombreOk)} quedó en el ranking.</p>`; return; }
    if (ui.finCelular.querySelector(".nombre-cel")) return;
    ui.finCelular.innerHTML = `${titulo}<form class="nombre-cel">
      <label for="nombre-cel-campo">Escribe tu nombre para el ranking</label>
      <div class="guardar-nombre"><input id="nombre-cel-campo" maxlength="14" autocomplete="off" placeholder="Tu nombre" aria-label="Tu nombre" required>
      <button class="btn btn-azul" type="submit">Guardar</button></div></form>`;
    const form = ui.finCelular.querySelector(".nombre-cel"), campo = form.querySelector("input"), boton = form.querySelector("button");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const n = campo.value.trim().slice(0, 14);
      if (!n || nombreEnviado || !conexion) return;
      nombreEnviado = true; campo.disabled = true; boton.disabled = true;
      Promise.resolve(conexion.marcar("nombres", n)).catch(() => { nombreEnviado = false; campo.disabled = false; boton.disabled = false; });
    });
  }

  // ---------- Ganchos del motor ----------
  return {
    esCelular,
    alAbrir() {
      if (esCelular) { unirse(); return; }
      ui.introModos.hidden = false; ui.introEspera.hidden = true; ui.jugar.hidden = false; ui.listo.hidden = true;
      pintarNumeros();
    },
    alTerminar(puntos, stats) {
      if (!esCelular) return;
      clearInterval(envio); clearInterval(envioVista); mandarVista();
      if (conexion) conexion.enviar({ tipo: "fin", puntos, stats });
      ui.finBotones.hidden = true; ui.finCelular.hidden = false;
      ui.finCelular.innerHTML = porPantalla ? "La partida se terminó desde la pantalla." : "Mira la pantalla grande: ahí está el marcador.";
      if (ultimoVivo && ultimoVivo.fase === "podio") mostrarPuesto(ultimoVivo.podio, ultimoVivo);
    },
    cerrar,
    dibujar: dibujarVivo,
    /** Entre una foto y la siguiente, cada vista sigue avanzando (camionetas, reloj…). */
    actualizar(dt) { for (const v of vistas) if (v && v.recibida && v.adelantar) { try { v.adelantar(dt); } catch { /* foto incompleta */ } } },
    urlDe: (p) => (sala ? sala.urlControl(p) : null),     // para pruebas
    estado: () => ({ estadoSala, jug }),
  };
})();

// =====================================================================
// Inicio: tarjetas y juego al azar
// =====================================================================
function pintarTarjetas() {
  const r = leerRecords();
  ui.tarjetas.innerHTML = JUEGOS.map((j) => `
    <button class="tarjeta" type="button" data-id="${j.id}" aria-label="Jugar ${j.nombre}">

        <span class="meta"><span>⏱ ${j.duracion}</span><span>${r[j.id] ? `Récord: <b>${fmt(r[j.id])}</b>` : "Sin récord aún"}</span></span>
      </span>
    </button>`).join("");
}
ui.tarjetas.addEventListener("click", (e) => {
  const b = e.target.closest(".tarjeta");
  if (!b || sorteando) return;
  abrirJuego(JUEGOS.find((j) => j.id === b.dataset.id));
});

let sorteando = false;
ui.azar.addEventListener("click", async () => {
  if (sorteando) return;
  sorteando = true;
  const tarjetas = [...ui.tarjetas.querySelectorAll(".tarjeta")];
  const elegida = rint(0, tarjetas.length - 1), pasos = tarjetas.length * 2 + elegida + 1;
  let i = -1;
  for (let k = 0; k < pasos; k++) {
    tarjetas.forEach((t) => t.classList.remove("sorteo"));
    i = (i + 1) % tarjetas.length;
    tarjetas[i].classList.add("sorteo");
    if (k === 0) tarjetas[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
    await new Promise((ok) => setTimeout(ok, 70 + 260 * (k / pasos) ** 2));
  }
  await new Promise((ok) => setTimeout(ok, 450));
  tarjetas.forEach((t) => t.classList.remove("sorteo"));
  sorteando = false;
  abrirJuego(JUEGOS[i]);
});

window.__minijuegos = { E, JUEGOS, estado: () => ({ fase, actual }), empezar, abrirJuego, online: Online_ };
pintarTarjetas();
const directo = JUEGOS.find((j) => j.id === DIRECTO);
if (directo) {
  // Dentro de la biblioteca, su barra ya tiene "← Biblioteca".
  if (EN_BIBLIOTECA) $("btn-volver").hidden = true;
  abrirJuego(directo);
}
})();
</script>
